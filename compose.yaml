name: smart-university

services:
  keygen:
    image: alpine:3.22
    profiles: [tools]
    volumes:
      - ./keys:/keys
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -e /keys/private.pem ] || [ -e /keys/public.pem ]; then
          echo 'Keys already exist; refusing to overwrite them.'
          exit 1
        fi
        apk add --no-cache openssl
        umask 077
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /keys/private.pem
        openssl pkey -in /keys/private.pem -pubout -out /keys/public.pem
        chown 999:999 /keys/private.pem
        chmod 644 /keys/public.pem
  postgres:
    # Ready-made PostgreSQL 17 + pgvector image (D74, replaces the D65 Alpine build).
    # Debian/glibc base with its own postgres_data_pgvector volume (data moved with pg_dump/pg_restore, see README).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:?Set REDIS_USERNAME in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly yes --maxmemory-policy noeviction
        --user default off
        --user "$$REDIS_USERNAME" on ">$$REDIS_PASSWORD" '~*' '&*' '+@all'
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user \"$$REDIS_USERNAME\" -n \"$$REDIS_DATABASE\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  admin-web:
    build:
      context: ${FRONTEND_PATH:-../../frontend/senior-project-smart-ai-admin-panel}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    volumes:
      - type: bind
        source: ./docker/admin-web.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      JWT_ISSUER: ${JWT_ISSUER:-smart-university-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smart-university-backend}
      JWT_KEY_ID: ${JWT_KEY_ID:-auth-key-1}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-30s}
      AUTH_REDIS_KEY_PREFIX: ${AUTH_REDIS_KEY_PREFIX:-susa:dev:auth}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-7d}
      AUTH_PASSWORD_CHANGE_TTL: ${AUTH_PASSWORD_CHANGE_TTL:-10m}
      AUTH_MAX_ROTATIONS: ${AUTH_MAX_ROTATIONS:-2000}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-12}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_DURATION: ${AUTH_LOCK_DURATION:-15m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-2s}
      AUTH_LOGIN_PER_IP: ${AUTH_LOGIN_PER_IP:-60}
      AUTH_LOGIN_PER_IDENTIFIER: ${AUTH_LOGIN_PER_IDENTIFIER:-10}
      AUTH_REFRESH_PER_IP: ${AUTH_REFRESH_PER_IP:-120}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-4}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-8}
      AI_MAX_REQUEST_SECONDS: ${AI_MAX_REQUEST_SECONDS:-120}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-768}
      AI_EMBEDDING_SEND_DIMENSIONS: ${AI_EMBEDDING_SEND_DIMENSIONS:-true}
      AI_EMBEDDING_TRUNCATE_LONGER_VECTORS: ${AI_EMBEDDING_TRUNCATE_LONGER_VECTORS:-true}
      AI_EMBEDDING_BATCH_SIZE: ${AI_EMBEDDING_BATCH_SIZE:-16}
      AI_EMBEDDING_MAX_BATCH_TOKENS: ${AI_EMBEDDING_MAX_BATCH_TOKENS:-8000}
      AI_EMBEDDING_TIMEOUT_SECONDS: ${AI_EMBEDDING_TIMEOUT_SECONDS:-30}
      AI_EMBEDDING_QUERY_TIMEOUT_SECONDS: ${AI_EMBEDDING_QUERY_TIMEOUT_SECONDS:-10}
      AI_EMBEDDING_MAX_RETRIES: ${AI_EMBEDDING_MAX_RETRIES:-2}
      AI_EMBEDDING_MIN_INTERVAL_MS: ${AI_EMBEDDING_MIN_INTERVAL_MS:-1000}
      AI_CONTEXT_ENABLED: ${AI_CONTEXT_ENABLED:-true}
      AI_CONTEXT_TTL_MINUTES: ${AI_CONTEXT_TTL_MINUTES:-30}
      AI_CONTEXT_MAX_TURNS: ${AI_CONTEXT_MAX_TURNS:-6}
      AI_CONTEXT_MAX_COURSE_REFERENCES: ${AI_CONTEXT_MAX_COURSE_REFERENCES:-20}
      AI_CONTEXT_MAX_BYTES: ${AI_CONTEXT_MAX_BYTES:-32768}
      AI_HISTORY_ENABLED: ${AI_HISTORY_ENABLED:-true}
      AI_KNOWLEDGE_ENABLED: ${AI_KNOWLEDGE_ENABLED:-true}
      AI_KNOWLEDGE_TOP_K: ${AI_KNOWLEDGE_TOP_K:-4}
      AI_KNOWLEDGE_MAX_CONTEXT_CHARS: ${AI_KNOWLEDGE_MAX_CONTEXT_CHARS:-8000}
      AI_KNOWLEDGE_MAX_SEARCHES_PER_REQUEST: ${AI_KNOWLEDGE_MAX_SEARCHES_PER_REQUEST:-2}
      AI_KNOWLEDGE_OWN_PROGRAM_QUOTA: ${AI_KNOWLEDGE_OWN_PROGRAM_QUOTA:-2}
      AI_KNOWLEDGE_MAX_NEIGHBOR_PASSAGES: ${AI_KNOWLEDGE_MAX_NEIGHBOR_PASSAGES:-2}
      AI_ACADEMIC_PROGRESS_ENABLED: ${AI_ACADEMIC_PROGRESS_ENABLED:-true}
      AI_HYBRID_ANSWERS_ENABLED: ${AI_HYBRID_ANSWERS_ENABLED:-true}
      UNIVERSITY_TIMEZONE: ${UNIVERSITY_TIMEZONE:-Asia/Bangkok}
      KNOWLEDGE_STORAGE_TYPE: ${KNOWLEDGE_STORAGE_TYPE:-local}
      KNOWLEDGE_STORAGE_ROOT: /app/storage/academic-documents
      KNOWLEDGE_MAX_FILE_SIZE_MB: ${KNOWLEDGE_MAX_FILE_SIZE_MB:-50}
      KNOWLEDGE_UPLOAD_ENABLED: ${KNOWLEDGE_UPLOAD_ENABLED:-true}
      KNOWLEDGE_STORAGE_DELETE_ORPHANS: ${KNOWLEDGE_STORAGE_DELETE_ORPHANS:-false}
      KNOWLEDGE_INGESTION_ENABLED: ${KNOWLEDGE_INGESTION_ENABLED:-true}
      KNOWLEDGE_INGESTION_SCHEDULER_ENABLED: ${KNOWLEDGE_INGESTION_SCHEDULER_ENABLED:-true}
      KNOWLEDGE_INGESTION_AUTO_QUEUE: ${KNOWLEDGE_INGESTION_AUTO_QUEUE:-true}
      KNOWLEDGE_INGESTION_POLL_INTERVAL: ${KNOWLEDGE_INGESTION_POLL_INTERVAL:-5s}
      KNOWLEDGE_INGESTION_MAX_ATTEMPTS: ${KNOWLEDGE_INGESTION_MAX_ATTEMPTS:-4}
      KNOWLEDGE_INGESTION_RETRY_INITIAL_DELAY: ${KNOWLEDGE_INGESTION_RETRY_INITIAL_DELAY:-2m}
      KNOWLEDGE_INGESTION_RETRY_MULTIPLIER: ${KNOWLEDGE_INGESTION_RETRY_MULTIPLIER:-5}
      KNOWLEDGE_INGESTION_RETRY_MAX_DELAY: ${KNOWLEDGE_INGESTION_RETRY_MAX_DELAY:-6h}
      KNOWLEDGE_INGESTION_STALE_AFTER: ${KNOWLEDGE_INGESTION_STALE_AFTER:-15m}
      KNOWLEDGE_INGESTION_STAGE_TIMEOUT: ${KNOWLEDGE_INGESTION_STAGE_TIMEOUT:-30m}
      KNOWLEDGE_EXTRACTION_MAX_PAGES: ${KNOWLEDGE_EXTRACTION_MAX_PAGES:-2000}
      KNOWLEDGE_EXTRACTION_MAX_CHARS: ${KNOWLEDGE_EXTRACTION_MAX_CHARS:-5000000}
      KNOWLEDGE_EXTRACTION_UNIT_MAX_CHARS: ${KNOWLEDGE_EXTRACTION_UNIT_MAX_CHARS:-20000}
      KNOWLEDGE_EXTRACTION_TIMEOUT: ${KNOWLEDGE_EXTRACTION_TIMEOUT:-5m}
      KNOWLEDGE_EXTRACTION_PDF_SORT_BY_POSITION: ${KNOWLEDGE_EXTRACTION_PDF_SORT_BY_POSITION:-true}
      KNOWLEDGE_EXTRACTION_TEMP_DIR: ${KNOWLEDGE_EXTRACTION_TEMP_DIR:-}
      KNOWLEDGE_CLEANING_UNWRAP_LINES: ${KNOWLEDGE_CLEANING_UNWRAP_LINES:-true}
      KNOWLEDGE_CLEANING_REMOVE_REPEATED_LINES: ${KNOWLEDGE_CLEANING_REMOVE_REPEATED_LINES:-true}
      KNOWLEDGE_CLEANING_THAI_DIGITS_TO_ASCII: ${KNOWLEDGE_CLEANING_THAI_DIGITS_TO_ASCII:-true}
      KNOWLEDGE_CHUNK_TARGET_CHARS: ${KNOWLEDGE_CHUNK_TARGET_CHARS:-1000}
      KNOWLEDGE_CHUNK_MAX_CHARS: ${KNOWLEDGE_CHUNK_MAX_CHARS:-1500}
      KNOWLEDGE_CHUNK_MIN_CHARS: ${KNOWLEDGE_CHUNK_MIN_CHARS:-200}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-150}
      KNOWLEDGE_CHUNK_MAX_CHUNKS: ${KNOWLEDGE_CHUNK_MAX_CHUNKS:-5000}
      KNOWLEDGE_SEARCH_DEFAULT_TOP_K: ${KNOWLEDGE_SEARCH_DEFAULT_TOP_K:-5}
      KNOWLEDGE_SEARCH_MIN_SCORE: ${KNOWLEDGE_SEARCH_MIN_SCORE:-0.50}
      KNOWLEDGE_SEARCH_MAX_PER_DOCUMENT: ${KNOWLEDGE_SEARCH_MAX_PER_DOCUMENT:-3}
      KNOWLEDGE_SEARCH_HNSW_EF_SEARCH: ${KNOWLEDGE_SEARCH_HNSW_EF_SEARCH:-100}
      KNOWLEDGE_SEARCH_QUERY_CACHE_TTL: ${KNOWLEDGE_SEARCH_QUERY_CACHE_TTL:-24h}
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:?Set REDIS_USERNAME in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Uploaded knowledge documents survive container recreation; include this volume in backups.
      - academic_document_storage:/app/storage/academic-documents
      - type: bind
        source: ${JWT_PRIVATE_KEY_PATH:?Set JWT_PRIVATE_KEY_PATH in .env}
        target: /app/keys/private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JWT_PUBLIC_KEY_PATH:?Set JWT_PUBLIC_KEY_PATH in .env}
        target: /app/keys/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_pgvector:
  redis_data:
  academic_document_storage:
