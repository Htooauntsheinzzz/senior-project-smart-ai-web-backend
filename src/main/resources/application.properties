spring.application.name=seniorproject
spring.config.import=optional:file:.env[.properties]
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.port=${BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_university_db}
spring.datasource.username=${POSTGRES_USER:smartrsu}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:smartrsu}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

app.security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
app.security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.data.redis.repositories.enabled=false
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.jpa.properties.jakarta.persistence.query.timeout=5000

app.auth.jwt.issuer=${JWT_ISSUER:smart-university-auth}
app.auth.jwt.audience=${JWT_AUDIENCE:smart-university-backend}
app.auth.jwt.key-id=${JWT_KEY_ID:auth-key-1}
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.auth.jwt.clock-skew=${JWT_CLOCK_SKEW:30s}
app.auth.session.key-prefix=${AUTH_REDIS_KEY_PREFIX:susa:dev:auth}
app.auth.session.refresh-ttl=${AUTH_REFRESH_TTL:7d}
app.auth.session.password-change-ttl=${AUTH_PASSWORD_CHANGE_TTL:10m}
app.auth.session.max-rotations=${AUTH_MAX_ROTATIONS:2000}
app.auth.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.auth.password.min-code-points=15
app.auth.password.max-utf8-bytes=72
app.auth.lockout.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout.duration=${AUTH_LOCK_DURATION:15m}
app.auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.throttle.login-per-ip=${AUTH_LOGIN_PER_IP:60}
app.auth.throttle.login-per-identifier=${AUTH_LOGIN_PER_IDENTIFIER:10}
app.auth.throttle.refresh-per-ip=${AUTH_REFRESH_PER_IP:120}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never

# Cloud LLM (OpenAI-compatible Chat Completions). Real values come only from the environment or the git-ignored .env.
app.ai.provider=${AI_PROVIDER:openai-compatible}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.base-url=${AI_BASE_URL:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
app.ai.connect-timeout-seconds=${AI_CONNECT_TIMEOUT_SECONDS:10}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1024}
app.ai.max-retries=${AI_MAX_RETRIES:1}
app.ai.retry-backoff=${AI_RETRY_BACKOFF:500ms}
app.ai.max-tool-rounds=${AI_MAX_TOOL_ROUNDS:4}
app.ai.max-tool-calls=${AI_MAX_TOOL_CALLS:8}
# Wall-clock bound for one whole chat request (all provider calls and tool runs together).
app.ai.max-request-seconds=${AI_MAX_REQUEST_SECONDS:120}
# Step 10: short-lived multi-turn conversation context in Redis (student:assistant:conversation:<id>).
app.ai.context.enabled=${AI_CONTEXT_ENABLED:true}
app.ai.context.ttl-minutes=${AI_CONTEXT_TTL_MINUTES:30}
app.ai.context.max-turns=${AI_CONTEXT_MAX_TURNS:6}
app.ai.context.max-course-references=${AI_CONTEXT_MAX_COURSE_REFERENCES:20}
app.ai.context.max-bytes=${AI_CONTEXT_MAX_BYTES:32768}
# Step 17: persistent conversation history in PostgreSQL (assistant_conversations, assistant_messages).
app.ai.history.enabled=${AI_HISTORY_ENABLED:true}
# Step 15A: the assistant's knowledge search tool (active only when an embedding model is configured too).
app.ai.knowledge.enabled=${AI_KNOWLEDGE_ENABLED:true}
app.ai.knowledge.top-k=${AI_KNOWLEDGE_TOP_K:4}
app.ai.knowledge.max-context-chars=${AI_KNOWLEDGE_MAX_CONTEXT_CHARS:8000}
app.ai.knowledge.max-searches-per-request=${AI_KNOWLEDGE_MAX_SEARCHES_PER_REQUEST:2}
# Step 15B: curriculum-aware retrieval for the assistant.
app.ai.knowledge.own-program-quota=${AI_KNOWLEDGE_OWN_PROGRAM_QUOTA:2}
app.ai.knowledge.max-neighbor-passages=${AI_KNOWLEDGE_MAX_NEIGHBOR_PASSAGES:2}
# Step 16A: the assistant's academic progress tool.
app.ai.progress.enabled=${AI_ACADEMIC_PROGRESS_ENABLED:true}
# Step 16B: answers that combine the Student's progress with the university documents.
app.ai.progress.hybrid-enabled=${AI_HYBRID_ANSWERS_ENABLED:true}

# Step 13: AI Knowledge Base document storage. Files are kept outside the project and the web root; Docker mounts a volume.
app.knowledge.upload-enabled=${KNOWLEDGE_UPLOAD_ENABLED:true}
app.knowledge.max-file-size-mb=${KNOWLEDGE_MAX_FILE_SIZE_MB:50}
app.knowledge.storage.type=${KNOWLEDGE_STORAGE_TYPE:local}
app.knowledge.storage.root=${KNOWLEDGE_STORAGE_ROOT:${user.home}/smart-university-storage/academic-documents}
app.knowledge.storage.delete-orphans=${KNOWLEDGE_STORAGE_DELETE_ORPHANS:false}
spring.servlet.multipart.max-file-size=${KNOWLEDGE_MAX_FILE_SIZE_MB:50}MB
spring.servlet.multipart.max-request-size=52MB
# Read (and discard) a slightly oversized body so the client receives the 413 response instead of a reset connection.
server.tomcat.max-swallow-size=64MB

# Step 14B: knowledge document ingestion worker.
app.knowledge.ingestion.enabled=${KNOWLEDGE_INGESTION_ENABLED:true}
app.knowledge.ingestion.scheduler-enabled=${KNOWLEDGE_INGESTION_SCHEDULER_ENABLED:true}
app.knowledge.ingestion.auto-queue=${KNOWLEDGE_INGESTION_AUTO_QUEUE:true}
app.knowledge.ingestion.poll-interval=${KNOWLEDGE_INGESTION_POLL_INTERVAL:5s}
app.knowledge.ingestion.max-attempts=${KNOWLEDGE_INGESTION_MAX_ATTEMPTS:4}
app.knowledge.ingestion.retry-initial-delay=${KNOWLEDGE_INGESTION_RETRY_INITIAL_DELAY:2m}
app.knowledge.ingestion.retry-multiplier=${KNOWLEDGE_INGESTION_RETRY_MULTIPLIER:5}
app.knowledge.ingestion.retry-max-delay=${KNOWLEDGE_INGESTION_RETRY_MAX_DELAY:6h}
app.knowledge.ingestion.stale-after=${KNOWLEDGE_INGESTION_STALE_AFTER:15m}
app.knowledge.ingestion.stage-timeout=${KNOWLEDGE_INGESTION_STAGE_TIMEOUT:30m}

# Step 14C: text extraction from stored knowledge documents.
app.knowledge.extraction.max-pages=${KNOWLEDGE_EXTRACTION_MAX_PAGES:2000}
app.knowledge.extraction.max-chars=${KNOWLEDGE_EXTRACTION_MAX_CHARS:5000000}
app.knowledge.extraction.unit-max-chars=${KNOWLEDGE_EXTRACTION_UNIT_MAX_CHARS:20000}
app.knowledge.extraction.timeout=${KNOWLEDGE_EXTRACTION_TIMEOUT:5m}
app.knowledge.extraction.pdf-sort-by-position=${KNOWLEDGE_EXTRACTION_PDF_SORT_BY_POSITION:true}
app.knowledge.extraction.temp-dir=${KNOWLEDGE_EXTRACTION_TEMP_DIR:}

# Step 14D: cleaning of extracted knowledge document text.
app.knowledge.cleaning.unwrap-lines=${KNOWLEDGE_CLEANING_UNWRAP_LINES:true}
app.knowledge.cleaning.remove-repeated-lines=${KNOWLEDGE_CLEANING_REMOVE_REPEATED_LINES:true}
app.knowledge.cleaning.thai-digits-to-ascii=${KNOWLEDGE_CLEANING_THAI_DIGITS_TO_ASCII:true}

# Step 14E: splitting cleaned knowledge document text into chunks. Sizes are in characters.
app.knowledge.chunking.target-chars=${KNOWLEDGE_CHUNK_TARGET_CHARS:1000}
app.knowledge.chunking.max-chars=${KNOWLEDGE_CHUNK_MAX_CHARS:1500}
app.knowledge.chunking.min-chars=${KNOWLEDGE_CHUNK_MIN_CHARS:200}
app.knowledge.chunking.overlap-chars=${KNOWLEDGE_CHUNK_OVERLAP_CHARS:150}
app.knowledge.chunking.max-chunks=${KNOWLEDGE_CHUNK_MAX_CHUNKS:5000}

# Step 14F: embeddings for knowledge chunks and search queries (OpenAI-compatible /embeddings endpoint).
# Empty AI_EMBEDDING_BASE_URL / AI_EMBEDDING_API_KEY / AI_EMBEDDING_PROVIDER reuse the chat values (resolved in code).
app.knowledge.embedding.provider=${AI_EMBEDDING_PROVIDER:}
app.knowledge.embedding.base-url=${AI_EMBEDDING_BASE_URL:}
app.knowledge.embedding.api-key=${AI_EMBEDDING_API_KEY:}
app.knowledge.embedding.model=${AI_EMBEDDING_MODEL:}
app.knowledge.embedding.dimensions=${AI_EMBEDDING_DIMENSIONS:768}
app.knowledge.embedding.send-dimensions=${AI_EMBEDDING_SEND_DIMENSIONS:true}
app.knowledge.embedding.truncate-longer-vectors=${AI_EMBEDDING_TRUNCATE_LONGER_VECTORS:true}
app.knowledge.embedding.batch-size=${AI_EMBEDDING_BATCH_SIZE:16}
app.knowledge.embedding.max-batch-tokens=${AI_EMBEDDING_MAX_BATCH_TOKENS:8000}
app.knowledge.embedding.timeout-seconds=${AI_EMBEDDING_TIMEOUT_SECONDS:30}
app.knowledge.embedding.query-timeout-seconds=${AI_EMBEDDING_QUERY_TIMEOUT_SECONDS:10}
app.knowledge.embedding.connect-timeout-seconds=${AI_EMBEDDING_CONNECT_TIMEOUT_SECONDS:10}
app.knowledge.embedding.max-retries=${AI_EMBEDDING_MAX_RETRIES:2}
app.knowledge.embedding.retry-backoff=${AI_EMBEDDING_RETRY_BACKOFF:2s}
app.knowledge.embedding.min-interval-ms=${AI_EMBEDDING_MIN_INTERVAL_MS:1000}

# Step 14H: semantic search over knowledge chunks. min-score is an uncalibrated starting value (spec file 52, section 18).
app.knowledge.search.default-top-k=${KNOWLEDGE_SEARCH_DEFAULT_TOP_K:5}
app.knowledge.search.min-score=${KNOWLEDGE_SEARCH_MIN_SCORE:0.50}
app.knowledge.search.max-per-document=${KNOWLEDGE_SEARCH_MAX_PER_DOCUMENT:3}
app.knowledge.search.hnsw-ef-search=${KNOWLEDGE_SEARCH_HNSW_EF_SEARCH:100}
app.knowledge.search.query-cache-ttl=${KNOWLEDGE_SEARCH_QUERY_CACHE_TTL:24h}

# Student mobile academic data (spec file 40)
app.student-academic.timezone=${UNIVERSITY_TIMEZONE:Asia/Bangkok}
app.student-academic.deadline-default-limit=${STUDENT_DEADLINE_DEFAULT_LIMIT:20}
app.student-academic.deadline-max-limit=${STUDENT_DEADLINE_MAX_LIMIT:100}
app.student-academic.deadline-default-window-days=${STUDENT_DEADLINE_WINDOW_DAYS:60}
app.student-academic.deadline-max-window-days=${STUDENT_DEADLINE_MAX_WINDOW_DAYS:366}
app.student-academic.home-deadline-limit=${STUDENT_HOME_DEADLINE_LIMIT:5}

# Campus navigation (spec file 41). Estimates only, not guaranteed walking performance.
app.campus.walking-speed-meters-per-second=${CAMPUS_WALKING_SPEED_MPS:1.3}
app.campus.max-origin-snap-distance-meters=${CAMPUS_MAX_ORIGIN_SNAP_METERS:75}
app.campus.lowest-floor-number=${CAMPUS_LOWEST_FLOOR_NUMBER:-5}
app.campus.nearby-default-limit=${CAMPUS_NEARBY_DEFAULT_LIMIT:10}
app.campus.nearby-max-limit=${CAMPUS_NEARBY_MAX_LIMIT:50}
