spring.application.name=seniorproject
spring.config.import=optional:file:.env[.properties]
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.port=${BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_university_db}
spring.datasource.username=${POSTGRES_USER:smartrsu}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:smartrsu}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

app.security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
app.security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.data.redis.repositories.enabled=false
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.jpa.properties.jakarta.persistence.query.timeout=5000

app.auth.jwt.issuer=${JWT_ISSUER:smart-university-auth}
app.auth.jwt.audience=${JWT_AUDIENCE:smart-university-backend}
app.auth.jwt.key-id=${JWT_KEY_ID:auth-key-1}
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.auth.jwt.clock-skew=${JWT_CLOCK_SKEW:30s}
app.auth.session.key-prefix=${AUTH_REDIS_KEY_PREFIX:susa:dev:auth}
app.auth.session.refresh-ttl=${AUTH_REFRESH_TTL:7d}
app.auth.session.password-change-ttl=${AUTH_PASSWORD_CHANGE_TTL:10m}
app.auth.session.max-rotations=${AUTH_MAX_ROTATIONS:2000}
app.auth.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.auth.password.min-code-points=15
app.auth.password.max-utf8-bytes=72
app.auth.lockout.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout.duration=${AUTH_LOCK_DURATION:15m}
app.auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.throttle.login-per-ip=${AUTH_LOGIN_PER_IP:60}
app.auth.throttle.login-per-identifier=${AUTH_LOGIN_PER_IDENTIFIER:10}
app.auth.throttle.refresh-per-ip=${AUTH_REFRESH_PER_IP:120}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
